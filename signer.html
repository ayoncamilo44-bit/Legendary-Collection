<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signer Profile | Collector Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        darkCard: '#111827',
                        darkBorder: '#1f293d',
                        goldPrimary: '#f59e0b',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #f3f4f6; }
        .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.07); }
        .gold-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col">

    <header class="sticky top-0 z-40 glass-panel border-b border-darkBorder">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg gold-btn flex items-center justify-center text-black font-extrabold text-base shadow">
                    <i class="fa-solid fa-address-book"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white leading-tight">Signer Directory</h1>
                    <p class="text-[11px] text-amber-400 font-medium">Public TTM Database</p>
                </div>
            </a>

            <div id="auth-nav-btn"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 flex-1 w-full">
        <div class="glass-card rounded-2xl p-6 border border-darkBorder">
            <h2 class="text-xl font-bold text-white">Signer Profile View</h2>
            <p class="text-xs text-gray-400 mt-1">Select a player from the directory to inspect success stats and tested addresses.</p>
        </div>
    </main>

    <footer class="glass-panel border-t border-darkBorder py-6 mt-auto text-center text-xs text-gray-500">
        <p>Collector Hub Platform • Multi-Tenant Community Network</p>
    </footer>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/directory.js"></script>
</body>
</html>
