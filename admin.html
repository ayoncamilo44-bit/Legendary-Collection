<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Site Admin | Legendary Collection</title>
    <link rel="stylesheet" href="./site.css">
    <link rel="stylesheet" href="./affiliates.css">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { darkBg:'#0b1120', darkCard:'#111827', darkBorder:'#1f2937', accent:'#6366f1', accentHover:'#818cf8', success:'#34d399', danger:'#f87171' } } } };
    </script>
</head>
<body class="min-h-screen bg-darkBg text-gray-100">
    <header class="glass border-b border-darkBorder px-6 py-5">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
            <a href="index.html" class="font-bold text-white">Legendary Collection</a>
            <nav class="flex items-center gap-4 text-sm" aria-label="Admin navigation">
                <a href="index.html" class="text-gray-300 hover:text-white">View site</a>
                <button id="signOutButton" class="text-gray-300 hover:text-white">Sign out</button>
            </nav>
        </div>
    </header>
    <main class="max-w-5xl mx-auto px-6 py-10">
        <div class="mb-8">
            <p class="text-xs font-semibold tracking-widest uppercase text-accentHover mb-2">Owner controls</p>
            <h1 class="text-3xl font-bold text-white">Owner tools</h1>
            <p class="text-gray-400 mt-2">Manage signer suggestions and site owner controls.</p>
        </div>
        <div id="adminStatus" class="glass-card rounded-xl p-5 mb-6 text-gray-300" role="status" aria-live="polite">Checking owner access…</div>
        <div id="adminQueues" class="space-y-8 hidden">
            <section class="glass-card rounded-2xl p-6">
                <h2 class="text-xl font-bold text-white mb-4">Signer suggestions <span id="signerCount" class="text-sm text-gray-400"></span></h2>
                <div id="signerQueue" class="space-y-3"></div>
            </section>
        </div>
    </main>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/admin.js"></script>
</body>
</html>
