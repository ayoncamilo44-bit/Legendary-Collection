<!-- Drag & Drop CSV Section -->
<div class="glass-card rounded-2xl p-6 border border-darkBorder mb-6">
  <h3 class="text-lg font-bold text-amber-400 mb-2">
    <i class="fa-solid fa-file-csv mr-2"></i>Bulk Import CSV
  </h3>
  <p class="text-xs text-gray-400 mb-4">
    Drag & drop your <code>players.csv</code> file here to instantly insert all records into your database.
  </p>

  <div id="dropZone" class="border-2 border-dashed border-darkBorder hover:border-goldPrimary rounded-xl p-8 text-center bg-darkBg/50 cursor-pointer transition">
    <i class="fa-solid fa-cloud-arrow-up text-3xl text-goldPrimary mb-2"></i>
    <p class="text-sm font-semibold text-white">Drag & drop your CSV file here</p>
    <p class="text-xs text-gray-500 mt-1">or click to choose a file from your computer</p>
    <input type="file" id="csvFileInput" accept=".csv" class="hidden">
  </div>

  <div id="uploadStatus" class="mt-3 text-xs hidden"></div>
</div>

<!-- Include PapaParse library for easy client-side CSV parsing -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
  const dropZone = document.getElementById('dropZone');
  const csvFileInput = document.getElementById('csvFileInput');
  const uploadStatus = document.getElementById('uploadStatus');

  // Open file selector when clicking the drop zone
  dropZone.addEventListener('click', () => csvFileInput.click());

  // Drag over effects
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('border-goldPrimary', 'bg-darkBg');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('border-goldPrimary', 'bg-darkBg');
  });

  // Handle dropped files
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('border-goldPrimary', 'bg-darkBg');
    const files = e.dataTransfer.files;
    if (files.length > 0) {
      processCSV(files[0]);
    }
  });

  // Handle selected files via input
  csvFileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      processCSV(e.target.files[0]);
    }
  });

  // Parse CSV and batch insert into Supabase
  function processCSV(file) {
    if (!file.name.endsWith('.csv')) {
      showStatus('Please upload a valid .csv file.', 'text-red-400');
      return;
    }

    showStatus('Parsing CSV file...', 'text-amber-400');

    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: async function(results) {
        const rows = results.data;
        if (!rows || rows.length === 0) {
          showStatus('CSV file appears to be empty.', 'text-red-400');
          return;
        }

        // Map CSV headers to Supabase database columns
        const formattedRecords = rows.map(row => ({
          player_name: row['Name'] || row['player_name'] || '',
          date_received_wait: row['Received / Wait'] || row['date_received_wait'] || '',
          address: row['Address'] || row['address'] || '',
          success_ratio: row['Success/Sent Ratio'] || row['success_ratio'] || '',
          comments: row['Comments'] || row['comments'] || ''
        }));

        showStatus(`Uploading ${formattedRecords.length} records to Supabase...`, 'text-amber-400');

        // Insert into Supabase
        const { data, error } = await supabase
          .from('cards table')
          .insert(formattedRecords);

        if (error) {
          showStatus(`Error uploading records: ${error.message}`, 'text-red-400');
        } else {
          showStatus(`Successfully imported ${formattedRecords.length} player records!`, 'text-green-400');
          if (typeof fetchAndRenderCards === 'function') {
            fetchAndRenderCards();
          }
        }
      },
      error: function(err) {
        showStatus(`CSV Parse Error: ${err.message}`, 'text-red-400');
      }
    });
  }

  function showStatus(message, textClass) {
    uploadStatus.className = `mt-3 text-xs ${textClass}`;
    uploadStatus.textContent = message;
    uploadStatus.classList.remove('hidden');
  }
</script>
