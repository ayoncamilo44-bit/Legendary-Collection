<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collector Hub & Public TTM Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        darkCard: '#111827',
                        darkBorder: '#1f293d',
                        goldPrimary: '#f59e0b',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #f3f4f6; }
        .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.07); }
        .gold-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col">

    <header class="sticky top-0 z-40 glass-panel border-b border-darkBorder">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg gold-btn flex items-center justify-center text-black font-extrabold text-base shadow">
                    <i class="fa-solid fa-users-rays"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white leading-tight">Collector Hub</h1>
                    <p class="text-[11px] text-amber-400 font-medium">Public TTM Database</p>
                </div>
            </div>

            <nav class="hidden md:flex items-center space-x-6 text-xs font-semibold text-gray-300">
                <a href="#feed" class="hover:text-amber-400 transition-colors">Live Feed</a>
                <a href="#directory" class="hover:text-amber-400 transition-colors">Signer Directory</a>
            </nav>

            <div id="auth-nav-btn"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10 flex-1 w-full">

        <section id="directory" class="glass-card rounded-2xl p-6 border border-darkBorder space-y-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h2 class="text-lg font-bold text-white flex items-center space-x-2">
                        <i class="fa-solid fa-magnifying-glass text-amber-400"></i>
                        <span>Search TTM Signer Directory</span>
                    </h2>
                    <p class="text-xs text-gray-400 mt-0.5">Lookup players, response rates, fees, and community address testing.</p>
                </div>
                <div class="w-full md:w-80 relative">
                    <input type="text" placeholder="Search player (e.g. Jack Youngblood)..." class="w-full pl-9 pr-4 py-2 bg-darkBg border border-darkBorder rounded-xl text-xs text-gray-200 placeholder-gray-500 focus:outline-none focus:border-amber-500">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-xs text-gray-500"></i>
                </div>
            </div>

            <div class="overflow-x-auto rounded-xl border border-darkBorder">
                <table class="w-full text-left text-xs text-gray-300">
                    <thead class="bg-darkBg text-gray-400 uppercase text-[10px] tracking-wider border-b border-darkBorder">
                        <tr>
                            <th class="px-4 py-3">Signer / Player</th>
                            <th class="px-4 py-3">Sport / Team</th>
                            <th class="px-4 py-3">Success Rate</th>
                            <th class="px-4 py-3">Avg Response</th>
                            <th class="px-4 py-3">Tested Address</th>
                            <th class="px-4 py-3 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-darkBorder"></tbody>
                </table>
            </div>
        </section>

    </main>

    <footer class="glass-panel border-t border-darkBorder py-6 mt-auto text-center text-xs text-gray-500">
        <p>Collector Hub Platform • Multi-Tenant Community Network</p>
    </footer>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/directory.js"></script>
</body>
</html>
